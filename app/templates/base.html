<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}BAM to VCF{% endblock %}</title>
    <style>
        body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 780px;
               margin: 3rem auto; padding: 0 1.5rem; color: #1a1a1a; line-height: 1.5; }
        h1 { color: #1F3A5F; }
        .card { background: #f7f8fa; border: 1px solid #e1e4e8; border-radius: 8px;
                padding: 1.5rem; margin: 1.5rem 0; }
        .flash { background: #fdecea; border: 1px solid #f5c2c0; color: #7a2e2a;
                 padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; font-size: 0.9rem; }
        th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #e1e4e8; }
        th { background: #eef1f5; }
        .stat { display: inline-block; margin-right: 2rem; }
        .stat strong { display: block; font-size: 1.4rem; color: #1F3A5F; }
        button, .btn { background: #1F3A5F; color: white; border: none; padding: 0.6rem 1.2rem;
               border-radius: 6px; font-size: 1rem; cursor: pointer; text-decoration: none;
               display: inline-block; }
        input[type=file] { margin: 1rem 0; }
        footer { margin-top: 3rem; font-size: 0.85rem; color: #666; }
    </style>
</head>
<body>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
    <footer>BAM → VCF demo app · GATK4 HaplotypeCaller under the hood · not for clinical use</footer>
</body>
</html>
